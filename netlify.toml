[build]
  publish = "."
  # Geen nieuwe deploy als alleen de zoekdata voor de redactie is bijgewerkt
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)content/zoekdata.md'"

# Oude link naar de homepage
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# www -> zonder www
[[redirects]]
  from = "https://www.voltwijk.nl/*"
  to = "https://voltwijk.nl/:splat"
  status = 301
  force = true

# Afbeeldingen en video's een week laten cachen (bij vervangen krijgt een bestand een nieuwe naam)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Merkboek en merkkit: wel bereikbaar, niet in Google
[[headers]]
  for = "/merk/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
